name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of which files changed
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Maps changed files to the jobs worth running. Skipped when the workflow is
  # called with full=true (releases) so tag builds always verify everything.
  changes:
    name: Detect changes
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      compat: ${{ steps.filter.outputs.compat }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "index.html"
              - "public/**"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "vite.config.ts"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "components.json"
              - ".oxlintrc.json"
              - ".oxfmtrc.json"
              - "scripts/**"
              - "compatibility/**"
              - "tools/item-material-compat/**"
              - ".github/workflows/ci.yml"
            rust:
              - "src-tauri/**"
              - "scripts/build-compatibility.sh"
              - ".github/workflows/ci.yml"
            compat:
              - "tools/item-material-compat/**"
              - "compatibility/**"
              - ".github/workflows/ci.yml"

  # Everything here is platform-independent, so it does not need a macOS runner.
  frontend:
    name: Frontend
    needs: changes
    if: ${{ always() && (inputs.full || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata and bundled plugin
        run: bun run verify:release

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Type-check and build frontend
        run: bun run build

      - name: Frontend tests
        run: bun run test

  # Pure .NET shader policy tests; no game assets required.
  compat:
    name: Compatibility plugin
    needs: changes
    if: ${{ always() && (inputs.full || needs.changes.outputs.compat == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Shader policy and pixel tests
        run: dotnet run --project tools/item-material-compat/tests/PolicyTests.csproj -c Release

  # Clippy runs `cargo check`; tests run a full build. Those artifacts are not
  # interchangeable, so keeping them in one job just compiles every dependency
  # twice, back to back. Split into parallel jobs with their own caches instead.
  rust-lint:
    name: Rust lint
    needs: changes
    if: ${{ always() && (inputs.full || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  rust-test:
    name: Rust tests
    needs: changes
    if: ${{ always() && (inputs.full || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
